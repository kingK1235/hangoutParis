<style>
  :root{
    --linen:#F7F3EC; --card:#FFFFFF; --line:#E4DED2; --charcoal:#2B2622; --muted:#8A8175;
    --sage:#6B8F71; --sage-deep:#4F6E55; --clay:#E2A16B; --neutral:#DCE3DE; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--linen);color:var(--charcoal);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:26px 20px 60px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px;}
  .brand-mark{font-weight:800;font-size:18px;letter-spacing:-0.2px;}
  .brand-mark span{color:var(--sage-deep);}
  h1{font-weight:700;font-size:26px;line-height:1.25;margin:0 0 10px;letter-spacing:-0.3px;}
  p.lede{font-size:14.5px;line-height:1.55;color:var(--muted);margin:0 0 26px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:10px;font-size:14.5px;font-weight:600;width:100%;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:disabled{opacity:0.4;}
  .btn-outline{background:transparent;color:var(--charcoal);border:1.5px solid var(--line);}
  .option-card{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
  .option-card h3{margin:0 0 4px;font-size:15.5px;font-weight:700;}
  .option-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.4;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
  input[type=text], input[type=datetime-local]{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--charcoal);padding:12px 14px;border-radius:10px;font-size:14.5px;}
  textarea{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--charcoal);padding:12px 14px;border-radius:10px;font-size:14px;min-height:64px;resize:vertical;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--charcoal);font-size:13.5px;font-weight:500;}
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  .people-count{display:flex;align-items:center;gap:16px;}
  .count-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:18px;}
  .count-val{font-weight:800;font-size:24px;min-width:30px;text-align:center;}
  .loading-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;margin:16px 0;}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--sage);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pickcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
  .pickcard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .src-tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .src-tag.list{background:var(--neutral);color:var(--sage-deep);}
  .src-tag.web{background:#FCEBD8;color:#9C6321;}
  .cat-tag{font-size:12px;color:var(--muted);}
  .pickcard h3{font-size:19px;font-weight:800;margin:2px 0 3px;}
  .pickcard .area{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .pickcard .blurb{font-size:13.5px;line-height:1.5;}
  .pickcard .reason{font-size:12.5px;color:var(--sage-deep);border-top:1px dashed var(--line);padding-top:9px;margin-top:9px;font-weight:500;}
  .pickcard .maps-link{font-size:12px;color:var(--muted);margin-top:8px;display:inline-block;}
  .error-box{background:#FBEAE6;border:1px solid #E3A99A;color:#8C3D2A;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:14px;}
  .footnote{font-size:11.5px;color:var(--muted);margin-top:32px;line-height:1.6;}
</style>

async function callClaude(prompt, tools){
  const r = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({prompt, tools})
  });
  const data = await r.json();
  if(data.error) throw new Error(data.error);
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
}
async function deriveTasteProfile(library){
  try{
    const prompt = `Here is a curated list of venues someone personally saved:\n${JSON.stringify(library.map(v=>({name:v.name,category:v.category,area:v.area,budget:v.budget,blurb:v.blurb})))}\n\nIn 3-4 sentences, describe the taste behind this list. Be specific. Output only the description, no preamble.`;
    const text = (await callClaude(prompt)).trim();
    if(text) return text;
  }catch(e){}
  return "A mix of well-regarded spots, generally mid-to-upper budget.";
}
function parseTakeoutCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  const rows = [];
  for(const line of lines){
    const fields=[]; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ if(inQuotes && line[i+1]==='"'){cur+='"';i++;} else inQuotes=!inQuotes; }
      else if(ch===',' && !inQuotes){ fields.push(cur); cur=''; }
      else cur+=ch;
    }
    fields.push(cur); rows.push(fields);
  }
  if(rows.length===0) return [];
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const titleIdx = header.indexOf('title'); const urlIdx = header.indexOf('url');
  if(titleIdx===-1) return [];
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const name=(r[titleIdx]||'').trim(); const url=urlIdx>=0?(r[urlIdx]||'').trim():'';
    if(name) out.push({name, mapsUrl:url});
  }
  return out;
}
function uid(len=4){const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<len;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
async function enrichImportedList(rawEntries){
  const prompt = `Here is a raw list of place names, with Google Maps links. For EACH one, in order, infer: category, 1-2 moods from [lively, chill, romantic, celebratory, active, cultural, indulgent], a budget level 1-4, a likely area, and a one-sentence blurb. Return exactly ${rawEntries.length} objects, same order, never inventing or dropping entries.\nList:\n${JSON.stringify(rawEntries.map(e=>e.name))}\n\nRespond with ONLY a raw JSON array:\n[{"category":"...","moods":["..."],"budget":1,"area":"...","blurb":"..."}]`;
  try{
    const text = await callClaude(prompt);
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    if(Array.isArray(parsed) && parsed.length===rawEntries.length){
      return rawEntries.map((e,i)=>({id:"imp-"+i+"-"+uid(),name:e.name,mapsUrl:e.mapsUrl||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.name)),
        category:parsed[i].category||"Venue",moods:Array.isArray(parsed[i].moods)&&parsed[i].moods.length?parsed[i].moods:["chill"],
        budget:parsed[i].budget||2,area:parsed[i].area||"Unknown",blurb:parsed[i].blurb||"",outdoor:false}));
    }
  }catch(e){}
  return rawEntries.map((e,i)=>({id:"imp-"+i+"-"+uid(),name:e.name,mapsUrl:e.mapsUrl||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.name)),
    category:"Venue",moods:["chill"],budget:2,area:"Unknown",blurb:"",outdoor:false}));
}
async function getWeatherFlag(dateStr){
  try{
    const target = new Date(dateStr+"T12:00:00Z");
    const days = Math.round((target - new Date())/86400000);
    if(days<0 || days>15) return {known:false};
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522&daily=precipitation_probability_max,temperature_2m_max&timezone=Europe%2FParis&start_date=${dateStr}&end_date=${dateStr}`);
    const d = await r.json();
    const rainProb = d?.daily?.precipitation_probability_max?.[0]; const tempMax = d?.daily?.temperature_2m_max?.[0];
    if(rainProb===undefined) return {known:false};
    const bad = rainProb>=60 || (tempMax!==undefined && (tempMax<=3 || tempMax>=34));
    return {known:true, bad, rainProb, tempMax};
  }catch(e){ return {known:false}; }
}
async function pickVenues(mode, library, tasteProfile, answers, feedbackNote=""){
  const moodCounts={}; const budgets=[];
  Object.values(answers).forEach(a=>{ moodCounts[a.mood]=(moodCounts[a.mood]||0)+1; budgets.push(a.budget); });
  const avgBudget = Math.round(budgets.reduce((a,b)=>a+b,0)/budgets.length)||2;
  const topMood = Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||"chill";
  const weather = answers.date ? await getWeatherFlag(answers.date) : {known:false};
  let candidates = (library||[]).slice();
  if(weather.known && weather.bad) candidates = candidates.filter(v=>!v.outdoor);
  const context = {
    answers, average_budget_level: avgBudget, mood_votes: moodCounts,
    weather: weather.known ? {bad_weather:weather.bad, rain_probability:weather.rainProb, max_temp_c:weather.tempMax} : "unknown",
    taste_profile: tasteProfile, feedback_on_previous_round: feedbackNote||null
  };
  function validate(picks, allowedIds){
    if(!Array.isArray(picks)) return null;
    const seen=new Set(); const out=[];
    for(const p of picks){ if(!p||!p.id||seen.has(p.id)) continue; if(allowedIds && !allowedIds.includes(p.id)) continue; seen.add(p.id); out.push(p); if(out.length===5) break; }
    return out.length===5?out:null;
  }
  try{
    if(mode==="list"){
      const allowedIds = candidates.map(v=>v.id);
      const prompt = `You are matching venues for an outing (daytime or evening — don't assume "night").\nContext:\n${JSON.stringify(context)}\n\nCandidates (choose ONLY from these, by id):\n${JSON.stringify(candidates.map(v=>({id:v.id,name:v.name,category:v.category,moods:v.moods,budget:v.budget,area:v.area,blurb:v.blurb})))}\n\nPick exactly 5 distinct ids that best fit, favoring variety. Respond with ONLY a raw JSON array:\n[{"id":"...","reason":"one specific sentence tied to a real factor"}]`;
      const text = await callClaude(prompt);
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      const valid = validate(parsed, allowedIds);
      if(!valid) throw new Error("invalid picks");
      return valid.map(p=>({...candidates.find(v=>v.id===p.id), reason:p.reason, source:"list"}));
    }
    if(mode==="surprise" || mode==="mix"){
      const searchPrompt = `Find 8-10 real, currently-operating venues that fit this plan. Use web search to verify each is real and open — do not invent. Context: ${JSON.stringify(context)}. Respond with ONLY a raw JSON array:\n[{"name":"...","category":"...","area":"...","budget":1-4,"blurb":"...","mapsQuery":"..."}]`;
      const searchText = await callClaude(searchPrompt, [{type:"web_search_20250305",name:"web_search"}]);
      let webCandidates=[]; try{ webCandidates=JSON.parse(searchText.replace(/```json|```/g,"").trim()); }catch(e){}
      webCandidates = webCandidates.map((v,i)=>({...v,id:"web-"+i}));
      let pool=webCandidates; let poolMap={}; webCandidates.forEach(v=>poolMap[v.id]=v);
      if(mode==="mix"){ candidates.forEach(v=>poolMap[v.id]=v); pool=[...candidates,...webCandidates]; }
      const allowedIds = pool.map(v=>v.id);
      const decidePrompt = `Choose exactly 5 distinct venues (by id) for this plan.\nContext:\n${JSON.stringify(context)}\nCandidates:\n${JSON.stringify(pool.map(v=>({id:v.id,name:v.name,category:v.category,area:v.area,budget:v.budget,blurb:v.blurb})))}\nRespond with ONLY a raw JSON array:\n[{"id":"...","reason":"..."}]`;
      const decideText = await callClaude(decidePrompt);
      const parsed = JSON.parse(decideText.replace(/```json|```/g,"").trim());
      const valid = validate(parsed, allowedIds);
      if(!valid) throw new Error("invalid picks");
      return valid.map(p=>{
        const v=poolMap[p.id]; const fromList = v && candidates.find(l=>l.id===v.id);
        return {id:p.id,name:v.name,category:v.category,area:v.area,budget:v.budget,blurb:v.blurb,
          mapsUrl: fromList?fromList.mapsUrl:("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v.mapsQuery||v.name)),
          reason:p.reason, source: fromList?"list":"web"};
      });
    }
  }catch(e){
    const scored = candidates.map(v=>{ let score=0; if(v.moods.includes(topMood)) score+=3; score-=Math.abs(v.budget-avgBudget); return {...v,score,reason:`Matches "${topMood}" and the budget level.`,source:"list"}; }).sort((a,b)=>b.score-a.score);
    return scored.slice(0,5);
  }
}

function renderHome(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>Test the matching engine</h1>
    <p class="lede">No accounts, nothing saved — answer a few questions, see what it recommends, judge for yourself.</p>
    <button class="btn btn-primary" id="startBtn">Start</button>
  `;
  document.getElementById('startBtn').onclick = renderModeSelect;
}
function renderModeSelect(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>How should it match?</h1>
    ${MODES.map(m=>`<button class="option-card" data-mode="${m.id}"><h3>${m.name}</h3><p>${m.desc}</p></button>`).join('')}
  `;
  [...document.querySelectorAll('.option-card')].forEach(el=>{
    el.onclick = ()=>{
      STATE.mode = el.dataset.mode;
      if(STATE.mode==="surprise") renderQuestions();
      else renderLibrarySetup();
    };
  });
}
function renderLibrarySetup(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>Which list should this use?</h1>
    <button class="option-card" id="starterBtn"><h3>Use the starter list</h3><p>29 curated Paris spots.</p></button>
    <button class="option-card" id="importBtn"><h3>Import your own list</h3><p>Paste your own Google Maps list.</p></button>
  `;
  document.getElementById('starterBtn').onclick = async ()=>{
    STATE.library = DEFAULT_LIBRARY;
    app.innerHTML = `<div class="brand"><div class="brand-mark">Engine <span>test</span></div></div><div class="loading-line"><span class="spinner"></span> Reading your list's taste…</div>`;
    STATE.tasteProfile = await deriveTasteProfile(DEFAULT_LIBRARY);
    renderQuestions();
  };
  document.getElementById('importBtn').onclick = renderImportScreen;
}
function renderImportScreen(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>Import your list</h1>
    <p class="lede">Works fine on a phone browser:</p>
    <div class="card">
      <p style="font-size:13px;line-height:1.6;margin:0;">
        1. Go to <strong>takeout.google.com</strong>, signed into the account with your list<br>
        2. Tap <strong>Deselect all</strong><br>
        3. Tick <strong>"Maps (your places)"</strong> and <strong>"Saved (your lists)"</strong><br>
        4. Tap <strong>Next step</strong> → <strong>.zip</strong> → <strong>Export once</strong> → <strong>Create export</strong><br>
        5. Open the download, unzip it — you'll find a folder <strong>Takeout → Saved</strong> with a .csv file for each list<br>
        6. Upload that .csv file below
      </p>
    </div>
    <div id="err"></div>
    <div class="field">
      <label>Your list's CSV file</label>
      <input type="file" id="csvFile" accept=".csv,text/csv">
    </div>
    <button class="btn btn-primary" id="useListBtn">Use this list</button>
    <button class="btn btn-outline" id="backBtn" style="margin-top:8px;">Back</button>
  `;
  document.getElementById('backBtn').onclick = renderLibrarySetup;
  document.getElementById('useListBtn').onclick = async ()=>{
    const fileInput = document.getElementById('csvFile');
    const errBox = document.getElementById('err');
    const file = fileInput.files && fileInput.files[0];
    if(!file){
      errBox.innerHTML = `<div class="error-box">Choose a .csv file first — it's inside Takeout → Saved after you unzip the download.</div>`;
      return;
    }
    const btn = document.getElementById('useListBtn');
    btn.disabled = true; btn.textContent = "Reading file…";
    let raw;
    try{
      raw = await file.text();
    }catch(e){
      errBox.innerHTML = `<div class="error-box">Couldn't read that file — make sure it's the .csv from Takeout → Saved.</div>`;
      btn.disabled = false; btn.textContent = "Use this list";
      return;
    }
    const parsed = parseTakeoutCSV(raw);
    if(parsed.length===0){
      errBox.innerHTML = `<div class="error-box">Couldn't find any places in that file — make sure it's the right .csv, with its header row intact.</div>`;
      btn.disabled = false; btn.textContent = "Use this list";
      return;
    }
    btn.textContent = `Reading ${parsed.length} places…`;
    try{
      const enriched = await enrichImportedList(parsed);
      const tasteProfile = await deriveTasteProfile(enriched);
      STATE.library = enriched; STATE.tasteProfile = tasteProfile;
      renderQuestions();
    }catch(e){
      errBox.innerHTML = `<div class="error-box">Something went wrong reading that list — try again.</div>`;
      btn.disabled = false; btn.textContent = "Use this list";
    }
  };
}
function renderQuestions(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>Quick questions</h1>
    <p class="lede">Answer as if this were a real plan.</p>
    <div id="err"></div>
    <div class="field"><label>How many people?</label>
      <div class="people-count"><button class="count-btn" id="dec">–</button><div class="count-val" id="countVal">4</div><button class="count-btn" id="inc">+</button></div>
    </div>
    <div class="field"><label>Date &amp; time</label><input type="datetime-local" id="q_datetime"></div>
    <div class="field"><label>Mood</label>
      <div class="chip-row" id="moodRow">${MOODS.map(m=>`<button class="chip" data-mood="${m.id}">${m.label}</button>`).join('')}</div>
      <textarea id="q_moodExtra" placeholder="Anything more specific? (optional)" style="margin-top:10px;"></textarea>
    </div>
    <div class="field"><label>Budget per person</label>
      <div class="chip-row" id="budgetRow">${BUDGETS.map(b=>`<button class="chip" data-budget="${b.id}">${b.label}</button>`).join('')}</div>
    </div>
    <div class="field"><label>Preferred area / where you're coming from</label><input type="text" id="q_area" placeholder="e.g. near Bastille"></div>
    <button class="btn btn-primary" id="submitBtn">Get my picks</button>
  `;
  let count=4, mood=null, budget=null;
  document.getElementById('dec').onclick=()=>{count=Math.max(1,count-1);document.getElementById('countVal').textContent=count;};
  document.getElementById('inc').onclick=()=>{count=Math.min(20,count+1);document.getElementById('countVal').textContent=count;};
  document.getElementById('moodRow').onclick=(e)=>{const b=e.target.closest('.chip');if(!b)return;[...document.getElementById('moodRow').children].forEach(c=>c.classList.remove('active'));b.classList.add('active');mood=b.dataset.mood;};
  document.getElementById('budgetRow').onclick=(e)=>{const b=e.target.closest('.chip');if(!b)return;[...document.getElementById('budgetRow').children].forEach(c=>c.classList.remove('active'));b.classList.add('active');budget=parseInt(b.dataset.budget);};
  const now=new Date(); now.setMinutes(0); document.getElementById('q_datetime').value = now.toISOString().slice(0,16);

  document.getElementById('submitBtn').onclick = async ()=>{
    const dt=document.getElementById('q_datetime').value;
    const area=document.getElementById('q_area').value.trim();
    const moodExtra=document.getElementById('q_moodExtra').value.trim();
    const errBox=document.getElementById('err');
    if(!dt||!mood||!budget||!area){ errBox.innerHTML=`<div class="error-box">Fill in date/time, mood, budget and area.</div>`; return; }
    const [date,time] = dt.split('T');
    STATE.answers = {size:count, date, time, mood, moodExtra, budget, area};
    renderGenerating();
  };
}
async function renderGenerating(feedbackNote){
  app.innerHTML = `<div class="brand"><div class="brand-mark">Engine <span>test</span></div></div><h1>Finding picks</h1><div class="loading-line"><span class="spinner"></span> Checking weather, matching…</div>`;
  try{
    const picks = await pickVenues(STATE.mode, STATE.library, STATE.tasteProfile, STATE.answers, feedbackNote);
    STATE.picks = picks;
    renderResults();
  }catch(e){
    app.innerHTML += `<div class="error-box">Something went wrong: ${e.message}</div><button class="btn btn-primary" id="retryBtn">Try again</button>`;
    document.getElementById('retryBtn').onclick = ()=>renderGenerating(feedbackNote);
  }
}
function renderResults(){
  app.innerHTML = `
    <div class="brand"><div class="brand-mark">Engine <span>test</span></div></div>
    <h1>Here's what it picked</h1>
    <p class="lede">Mode: <strong>${MODES.find(m=>m.id===STATE.mode)?.name}</strong></p>
    ${STATE.picks.map(v=>`
      <div class="pickcard">
        <div class="top"><span class="src-tag ${v.source==='list'?'list':'web'}">${v.source==='list'?'From the list':'AI found this'}</span><span class="cat-tag">${v.category}</span></div>
        <h3>${v.name}</h3>
        <div class="area">${v.area} · ${'€'.repeat(v.budget)}</div>
        <div class="blurb">${v.blurb}</div>
        <div class="reason">${v.reason||''}</div>
        <a class="maps-link" href="${v.mapsUrl}" target="_blank" rel="noopener">View on Google Maps →</a>
      </div>`).join('')}
    <div class="card" style="margin-top:8px;">
      <p style="font-size:13.5px;font-weight:600;margin:0 0 8px;">Not feeling these?</p>
      <textarea id="feedbackText" placeholder="What's wrong with them?"></textarea>
      <button class="btn btn-outline" id="regenBtn" style="margin-top:10px;">Try again with this feedback</button>
    </div>
    <button class="btn btn-primary" id="restartBtn" style="margin-top:14px;">Start over</button>
  `;
  document.getElementById('regenBtn').onclick = ()=>{
    const feedback = document.getElementById('feedbackText').value.trim();
    renderGenerating(feedback);
  };
  document.getElementById('restartBtn').onclick = ()=>{
    STATE = { mode:null, library:null, tasteProfile:null, answers:{} };
    renderHome();
  };
}

renderHome();
</script>
